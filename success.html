<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .success-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        .success-container img {
            width: 100px;
            height: 100px;
        }
        .success-container h2 {
            color: #28a745;
            margin: 20px 0;
        }
        .success-container p {
            font-size: 16px;
            color: #555;
        }
        .success-container a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0073ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .success-container a:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <img src="https://codeconvey.com/wp-content/uploads/2020/06/registration-successful-message-html.png.webp" alt="Success">
        <h2>Registration Successful!</h2>
        <p>Thank you for registering. Click below to proceed.</p>
        <!-- Change the href to the dashboard page -->
        <a href="/frontend/dashboard-alex.html">Go to Portal</a>

    </div>
</body>
</html>
