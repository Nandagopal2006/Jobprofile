<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .portal-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }
        h2 {
            color: #0073ff;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .logout-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: red;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .logout-btn:hover {
            background-color: darkred;
        }
        .go-to-portal-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0073ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .go-to-portal-btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <h2>Welcome to Your Profile!</h2>
        <p>You are now logged in.</p>
        <a href="index.html" class="logout-btn">Logout</a>
        <a href="dashboard-alex.html" class="go-to-portal-btn">Go to Your Portal</a>


    </div>

    <script>
        function openPortal() {
            // Create a new window for the dashboard page
            var dashboardWindow = window.open("", "_blank");
            dashboardWindow.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>User Dashboard</title>
                        <style>
                            body {
                                margin: 0;
                                font-family: Arial, sans-serif;
                                background-color: #f4f4f4;
                            }
                            .sidebar {
                                position: fixed;
                                left: 0;
                                width: 200px;
                                height: 100%;
                                background-color: #343a40;
                                color: white;
                                padding: 20px;
                            }
                            .sidebar a {
                                display: block;
                                color: white;
                                padding: 10px 0;
                                text-decoration: none;
                                margin-bottom: 10px;
                            }
                            .sidebar a:hover {
                                background-color: #0073ff;
                            }
                            .content {
                                margin-left: 220px;
                                padding: 20px;
                            }
                            .cards {
                                display: flex;
                                justify-content: space-around;
                                margin-bottom: 20px;
                            }
                            .card {
                                background-color: white;
                                padding: 20px;
                                border-radius: 10px;
                                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
                                flex: 1;
                                margin: 0 10px;
                                text-align: center;
                            }
                            .chart-container {
                                background-color: white;
                                padding: 20px;
                                border-radius: 10px;
                                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
                            }
                        </style>
                    </head>
                    <body>
                        <div class="sidebar">
                            <h2>Dashboard</h2>
                            <a href="#">Home</a>
                            <a href="#">Users</a>
                            <a href="#">Settings</a>
                            <a href="#">Logout</a>
                        </div>
                        <div class="content">
                            <h1>Welcome to Your Dashboard</h1>
                            <div class="cards">
                                <div class="card">
                                    <h3>9,823</h3>
                                    <p>Members Online</p>
                                </div>
                                <div class="card">
                                    <h3>150</h3>
                                    <p>New Signups</p>
                                </div>
                                <div class="card">
                                    <h3>240</h3>
                                    <p>Active Users</p>
                                </div>
                                <div class="card">
                                    <h3>$15,300</h3>
                                    <p>Revenue</p>
                                </div>
                            </div>
                            <div class="chart-container">
                                <h2>Traffic Overview</h2>
                                <p>Chart goes here (Placeholder)</p>
                            </div>
                        </div>
                    </body>
                </html>
            `);
        }
    </script>
</body>
</html>
