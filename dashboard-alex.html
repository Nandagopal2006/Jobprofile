<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex's Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js for graphs -->
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #9ba3ab;
        }
        .sidebar {
            position: fixed;
            left: 0;
            width: 220px;
            height: 100%;
            background-color: #4e92df;
            color: white;
            padding: 25px;
            box-shadow: 2px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 15px 0;
            text-decoration: none;
            margin-bottom: 15px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .sidebar a:hover {
            background-color: #b8c4ea;
        }
        .content {
            margin-left: 240px;
            padding: 30px;
        }
        h1 {
            color: #06030b;
            font-size: 2.2em;
            margin-bottom: 20px;
        }
        .cards {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .card {
            background: linear-gradient(145deg, #97902e, #ff5f6d);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            flex: 1;
            margin: 0 15px;
            text-align: center;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
        }
        .card h3 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 1.1em;
        }
        .chart-container {
            background-color: rgb(255, 255, 255);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .chart-container h2 {
            color: #425ba3;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .dashboard-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .dashboard-info div {
            background: #f2b156;
            color: white;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            margin-right: 15px;
            text-align: center;
        }
        .dashboard-info div:last-child {
            margin-right: 0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Alex's Dashboard</h2>
        <a href="#">Home</a>
        <a href="#">Analysis</a>
        <a href="#">Reports</a>
        <a href="#">Logout</a>
    </div>
    <div class="content">
        <h1>Welcome, Alex!</h1>

        <!-- User Activity Section -->
        <div class="dashboard-info">
            <div>
                <h3>Last Login</h3>
                <p>January 30, 2025, 3:45 PM</p>
            </div>
            <div>
                <h3>Applications Submitted</h3>
                <p>5</p>
            </div>
            <div>
                <h3>Pending Applications</h3>
                <p>2</p>
            </div>
            <div>
                <h3>Upcoming Deadlines</h3>
                <p>3</p>
            </div>
        </div>

        <!-- Cards Section
        <div class="cards">
            <div class="card" style="background: linear-gradient(145deg, #56ccf2, #6e7e8a);">
                <h3>9,823</h3>
                <p>Members Online</p>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #6a11cb, #2575fc);">
                <h3>150</h3>
                <p>New Signups</p>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #ff9a8b, #ff5f6d);">
                <h3>240</h3>
                <p>Active Users</p>
            </div>
            <div class="card" style="background: linear-gradient(145deg, #f8b500, #f07b3f);">
                <h3>$15,300</h3>
                <p>Revenue</p>
            </div>
        </div> -->

        <!-- Graph Section -->
        <div class="chart-container">
            <h2>Alex's Activity Overview</h2>
            <canvas id="activityChart"></canvas> <!-- Canvas for Chart -->
        </div>
    </div>

    <!-- Script to Render the Chart -->
    <script>
        var ctx = document.getElementById('activityChart').getContext('2d');
        var activityChart = new Chart(ctx, {
            type: 'line', // Chart type (you can change it to 'bar', 'pie', etc.)
            data: {
                labels: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December','January'],
                datasets: [{
                    label: 'Login Activity',
                    data: [12, 19, 3, 5, 2, 3, 4, 3, 2, 5,7,9,14], // Data points for each month (you can fetch dynamic data via API)
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
